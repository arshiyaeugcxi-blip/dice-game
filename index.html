<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازی تاس</title>
<style>
body{margin:0;font-family:Tahoma,Arial;background:linear-gradient(135deg,#10152f,#5427a5);color:white;text-align:center;min-height:100vh;display:grid;place-items:center}
.card{width:85%;max-width:380px;padding:24px;border-radius:24px;background:#ffffff15;box-shadow:0 10px 40px #0004}
h1{font-size:30px}
.dice{font-size:100px;margin:18px}
button{border:0;border-radius:14px;padding:14px 24px;margin:8px;font-size:18px;font-weight:bold;cursor:pointer}
#roll{background:#ffd43b;color:#242044}
#reset{background:#fff;color:#242044}
.score{font-size:20px}
</style>
</head>
<body>
<div class="card">
<h1>🎲 بازی تاس</h1>
<p>تاس بنداز و امتیاز جمع کن!</p>
<div class="dice" id="dice">⚄</div>
<button id="roll" onclick="rollDice()">تاس بنداز 🎲</button>
<button id="reset" onclick="resetGame()">شروع دوباره</button>
<p class="score">امتیاز: <span id="score">0</span></p>
<p id="message">برای شروع تاس بنداز!</p>
</div>
<script>
let score=0;
const faces=["⚀","⚁","⚂","⚃","⚄","⚅"];
function rollDice(){
 const n=Math.floor(Math.random()*6);
 document.getElementById("dice").textContent=faces[n];
 score+=n+1;
 document.getElementById("score").textContent=score;
 document.getElementById("message").textContent="عدد "+(n+1)+" آمد! آفرین 🎉";
}
function resetGame(){
 score=0;
 document.getElementById("score").textContent=score;
 document.getElementById("dice").textContent="⚄";
 document.getElementById("message").textContent="برای شروع تاس بنداز!";
}
</script>
</body>
</html>
